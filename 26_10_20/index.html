<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo 部署</title>
    <script src="./js文档.js">

    </script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body>
    <img id="myImage" onclick="changeImage()" src="img/off.gif" width="100" height="180">
    <p>点击灯泡就可以打开或关闭这盏灯</p>
    <script>
        function changeImage() {
            const element = document.getElementById("myImage");
            if (element.src.includes("off.gif")) {
                element.src = "img/no.gif";
            } else {
                element.src = "img/off.gif";
            }
        }
    </script>
</body>
</html>
